  <div id="footer-placeholder"></div>

  <script src="data.js" defer></script>
  <script>
    async function loadComponent(url, id) {
      try {
        var res = await fetch(url);
        if (!res.ok) throw new Error('fail');
        document.getElementById(id).innerHTML = await res.text();
      } catch (e) {
        if (id === 'header-placeholder') {
          document.getElementById(id).innerHTML =
            '<header class="site-header glass-bar"><div class="header-right"><button class="icon-btn" id="menu-btn" aria-label="منو"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button></div><div class="header-center"><div class="logo-text">پاساژگردی</div></div><div class="header-left"><button class="icon-btn" id="theme-toggle" aria-label="تم"><svg id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg id="icon-sun" class="hidden" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button></div></header><div class="nav-overlay" id="nav-overlay"></div><nav class="nav-drawer glass-strong" id="nav-drawer"><button class="icon-btn close-btn" id="close-nav" aria-label="بستن"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><ul class="nav-links"><li><a href="#">خانه</a></li><li><a href="#ads">تبلیغات</a></li><li><a href="admin.html">ثبت رایگان فروشگاه</a></li></ul></nav>';
        } else {
          document.getElementById(id).innerHTML = '<footer class="site-footer" id="ads"><div class="footer-inner glass-bar-footer"><div class="ad-banner">تبلیغات شما اینجاست</div><p class="footer-copy">© ۱۴۰۵ پاساژگردی</p></div></footer>';
        }
      }
    }
    Promise.all([
      loadComponent('header.html', 'header-placeholder'),
      loadComponent('footer.html', 'footer-placeholder')
    ]).then(function () {
      var s = document.createElement('script');
      s.src = 'app.js';
      document.body.appendChild(s);
    });
